name: Build & Release

# Triggered by pushing a version tag (e.g. v1.0, v1.1) or manually.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # required to create the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0   # full history for the commit-count versionCode

      # settings.gradle.kts compõe repositórios irmãos em ../ — o runner os
      # materializa aqui, pinados por siblings.lock (mesmo contrato do
      # isdr-app), para o build de tag ser reproduzível.
      - name: Materialize the pinned sibling modules
        env:
          WORKSPACE_PAT: ${{ secrets.WORKSPACE_PAT }}
        run: |
          set -euo pipefail
          while IFS='=' read -r name sha; do
            case "$name" in ''|'#'*) continue ;; esac
            echo "sibling $name @ $sha"
            git clone --no-checkout \
              "https://x-access-token:${WORKSPACE_PAT}@github.com/nrolabs/${name}.git" "../$name"
            git -C "../$name" checkout --detach "$sha"
          done < siblings.lock

      # Every release build in the family must speak the same wire contract:
      # compare this repo's isdr-proto pin against the sibling app repos'
      # siblings.lock and abort the release on any divergence.
      - name: Cross-check isdr-proto pin with sibling apps
        env:
          WORKSPACE_PAT: ${{ secrets.WORKSPACE_PAT }}
        run: |
          set -euo pipefail
          pin() { grep -E '^isdr-proto=' "$1" | cut -d= -f2; }
          MINE=$(pin siblings.lock)
          echo "isdr-drivers pins isdr-proto @ $MINE"
          for repo in isdr-app isdr-station; do
            git clone --depth 1 \
              "https://x-access-token:${WORKSPACE_PAT}@github.com/nrolabs/${repo}.git" "../pin-check-${repo}"
            THEIRS=$(pin "../pin-check-${repo}/siblings.lock")
            echo "${repo} pins isdr-proto @ $THEIRS"
            if [ "$MINE" != "$THEIRS" ]; then
              echo "::error::isdr-proto pin mismatch: isdr-drivers=$MINE ${repo}=$THEIRS — align siblings.lock in both repos before releasing"
              exit 1
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore keystore and signing credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > isdr.jks
          cat > keystore.properties <<EOF
          storeFile=isdr.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed AAB + APK
        run: |
          V="${GITHUB_REF_NAME#v}"
          ./gradlew bundleRelease assembleRelease --no-daemon -PversionName="${V:-1.0}"

      - name: Rename artifacts with the version
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab "dist/isdr-drivers-${V}.aab"
          cp app/build/outputs/apk/release/app-release.apk "dist/isdr-drivers-${V}.apk" 2>/dev/null \
            || cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/isdr-drivers-${V}.apk"

